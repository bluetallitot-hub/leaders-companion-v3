name: Leader's Companion V3 regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression checks
        run: node --test tests/regression.test.mjs
